[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imgclean"
version = "0.1.0"
description = "Audit and clean image datasets before training, labeling, or sharing."
authors = [{ name = "Wei Yuan Kong" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["image", "dataset", "quality", "duplicates", "machine-learning", "data-cleaning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "pydantic-settings>=2",
    "Pillow>=10",
    "opencv-python-headless>=4.8",
    "imagehash>=4.3",
    "numpy>=1.24",
    "jinja2>=3",
    "pyyaml>=6",
]

[project.optional-dependencies]
embeddings = [
    "torch>=2.0",
    "torchvision>=0.15",
    "open-clip-torch>=2.20",
    "faiss-cpu>=1.7",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
imgclean = "imgclean.cli.main:app"

[project.urls]
Homepage = "https://github.com/Weiykong/imgclean"
Repository = "https://github.com/Weiykong/imgclean"
Documentation = "https://github.com/Weiykong/imgclean#readme"
Issues = "https://github.com/Weiykong/imgclean/issues"
Changelog = "https://github.com/Weiykong/imgclean/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/imgclean"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
